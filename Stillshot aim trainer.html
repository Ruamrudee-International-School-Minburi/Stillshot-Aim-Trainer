<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stillshot aim trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{
  --paper:#F2F3EE; --sheet:rgba(242,243,238,.95); --ink:#1D2532; --ink-2:#5A6373; --line:#CDD2CA; --fill:#E4E7E0;
  --cobalt:#2747E8; --on-cobalt:#FFFFFF; --amber:#D18F00; --danger:#C2382A; --ok:#1E7F55;
  --font:'Archivo','Helvetica Neue',Arial,sans-serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#151A22; --sheet:rgba(21,26,34,.95); --ink:#E7EAE3; --ink-2:#9AA3B1; --line:#2E3644; --fill:#202733;
    --cobalt:#7A8DFF; --on-cobalt:#0D1330; --amber:#F2B731; --danger:#FF6E5E; --ok:#55D39B; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#151A22; --sheet:rgba(21,26,34,.95); --ink:#E7EAE3; --ink-2:#9AA3B1; --line:#2E3644; --fill:#202733;
  --cobalt:#7A8DFF; --on-cobalt:#0D1330; --amber:#F2B731; --danger:#FF6E5E; --ok:#55D39B; color-scheme:dark;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font:400 15px/1.5 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
body.aiming,body.aiming #gl{cursor:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}
h1,h2,h3,p{margin:0}

.screen{position:fixed;inset:0;display:none;z-index:10}
.screen.on{display:flex}

/* ---------- main menu ---------- */
#menu{pointer-events:none}
.sheet{pointer-events:auto;width:min(720px,100%);height:100%;background:var(--sheet);border-right:1px solid var(--line);display:grid;grid-template-columns:196px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px)}
.brand{grid-column:1/-1;padding:30px 32px 22px}
.logo{font-weight:900;font-stretch:125%;font-size:clamp(46px,7.2vw,88px);line-height:.86;letter-spacing:-.035em}
.tag{margin-top:14px;color:var(--ink-2);font-size:16px;max-width:40ch}
#nav{display:flex;flex-direction:column;gap:2px;padding:4px 0 24px 20px}
#nav button{appearance:none;background:none;border:0;border-left:3px solid transparent;text-align:left;cursor:pointer;padding:9px 12px 9px 14px;font-weight:700;font-stretch:112%;font-size:19px;color:var(--ink-2)}
#nav button:hover{color:var(--ink)}
#nav button[aria-current="true"]{color:var(--ink);border-left-color:var(--cobalt)}
.pane{overflow-y:auto;padding:2px 32px 30px 14px;scrollbar-width:thin;user-select:text;-webkit-user-select:text}
.foot{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 32px;border-top:1px solid var(--line);color:var(--ink-2);font-size:13px}
.foot .linkbtn{appearance:none;background:none;border:0;padding:0;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:13px}
.ptitle{font-weight:800;font-stretch:112%;font-size:26px;line-height:1.15}
.lede{color:var(--ink-2);margin-top:6px;max-width:52ch}
.hint{color:var(--ink-2);font-size:13px;margin-top:16px}
.note{color:var(--ink-2);font-size:14px}

/* buttons */
.btn{appearance:none;border:0;cursor:pointer;background:var(--cobalt);color:var(--on-cobalt);font-weight:700;font-stretch:108%;font-size:15px;padding:11px 18px;border-radius:4px;line-height:1.2}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.ghost:hover{box-shadow:inset 0 0 0 1.5px var(--ink-2);filter:none}
.btn.danger{color:var(--danger)}
.btn.sm{padding:7px 13px;font-size:14px}
.btn.big{width:100%;padding:15px;font-size:17px;margin-top:22px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{appearance:none;cursor:pointer;border:0;background:var(--fill);color:var(--ink);padding:8px 12px;border-radius:4px;font-weight:600;font-size:14px;line-height:1.2}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.stars{color:var(--amber);letter-spacing:2px;white-space:nowrap}
.stars .off{color:var(--line)}

/* path */
.chapters{list-style:none;margin:18px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.chap{appearance:none;width:100%;display:grid;grid-template-columns:42px minmax(0,1fr) auto;align-items:center;gap:12px;padding:11px 14px;background:var(--fill);border:1px solid transparent;border-radius:6px;cursor:pointer;text-align:left}
.chap[aria-expanded="true"]{background:transparent;border-color:var(--line)}
.chap:disabled{cursor:default;opacity:.62}
.cnum{font-stretch:62%;font-weight:800;font-size:36px;line-height:1;font-variant-numeric:tabular-nums;color:var(--cobalt)}
.chap:disabled .cnum{color:var(--ink-2)}
.cname b{display:block;font-size:17px;font-stretch:108%;line-height:1.25}
.cname small{display:block;color:var(--ink-2);font-size:13px;line-height:1.35}
.lock{color:var(--ink-2);font-size:13px;white-space:nowrap}
.exlist{padding:2px 0 8px 54px}
.ex{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.ex:last-child{border-bottom:0}
.ex b{display:block;font-size:16px;font-stretch:106%}
.ex small{display:block;color:var(--ink-2);font-size:13px}

/* practice */
.field{margin-top:20px}
.flabel{font-weight:700;font-size:14px;margin-bottom:8px}
.drills{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.drill{appearance:none;cursor:pointer;text-align:left;border:1px solid transparent;background:var(--fill);border-radius:6px;padding:10px 12px}
.drill b{display:block;font-size:16px;font-stretch:108%;line-height:1.2}
.drill small{display:block;color:var(--ink-2);font-size:13px}
.drill[aria-pressed="true"]{background:transparent;border-color:var(--cobalt);box-shadow:inset 0 0 0 1px var(--cobalt)}
.ddesc{margin-top:12px;color:var(--ink-2);max-width:56ch}
.pbline{margin-top:18px;font-size:14px;color:var(--ink-2)}
.pbline b{color:var(--ink);font-variant-numeric:tabular-nums}

/* armory */
.guns{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
.gunrow{appearance:none;cursor:pointer;border:1px solid transparent;background:var(--fill);border-radius:6px;padding:9px 13px;text-align:left}
.gunrow b{display:block;font-stretch:108%;font-size:15px;line-height:1.2}
.gunrow small{color:var(--ink-2);font-size:12px}
.gunrow[aria-pressed="true"]{background:transparent;border-color:var(--cobalt);box-shadow:inset 0 0 0 1px var(--cobalt)}
.gname{font-weight:900;font-stretch:118%;font-size:34px;line-height:1;margin-top:24px;letter-spacing:-.02em}
.gkind{color:var(--ink-2);margin-top:4px}
.bars{margin-top:16px;display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:8px 12px;align-items:center;font-size:14px}
.bar{height:6px;background:var(--fill);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink)}
.bars span:nth-child(3n){color:var(--ink-2);font-variant-numeric:tabular-nums;text-align:right}
.fins{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin-top:10px}
.fin{appearance:none;cursor:pointer;border:1px solid var(--line);background:transparent;border-radius:6px;padding:8px;text-align:left;font-size:13px}
.fin i{display:block;height:22px;border-radius:3px;background:var(--c);margin-bottom:6px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.fin small{display:block;color:var(--ink-2)}
.fin[aria-pressed="true"]{border-color:var(--cobalt);box-shadow:inset 0 0 0 1px var(--cobalt)}
.fin:disabled{cursor:default;opacity:.55}

/* stats */
.statgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 16px;margin-top:20px}
.statgrid dt{color:var(--ink-2);font-size:13px}
.statgrid dd{margin:0;font-weight:800;font-stretch:80%;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.sh3{font-weight:800;font-stretch:108%;font-size:17px;margin-top:28px}
.dtable{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px}
.dtable th{text-align:left;color:var(--ink-2);font-weight:600;font-size:13px;padding:6px 8px 6px 0;border-bottom:1px solid var(--line)}
.dtable td{padding:8px 8px 8px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.dtable td:first-child{font-weight:700}
.spark{display:block;color:var(--cobalt)}

/* settings */
.sgroup{margin-top:24px}
.sgroup:first-child{margin-top:12px}
.sgroup h3{font-weight:800;font-stretch:108%;font-size:17px;margin-bottom:6px}
.srow{display:grid;grid-template-columns:minmax(120px,170px) minmax(0,1fr) auto;align-items:center;gap:12px;padding:8px 0;font-size:14px;border-bottom:1px solid var(--line)}
.srow > span{color:var(--ink)}
.srow output{min-width:58px;text-align:right;color:var(--ink-2);font-variant-numeric:tabular-nums}
.srow .seg{grid-column:2/-1}
.srow input[type=number]{grid-column:2/-1;width:120px;padding:7px 9px;border-radius:4px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit}
.srow.tog{grid-template-columns:minmax(0,1fr) auto}
input[type=range]{width:100%;accent-color:var(--cobalt)}
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:40px;height:22px;border-radius:11px;background:var(--line);position:relative;cursor:pointer;margin:0;transition:background .15s}
input[type=checkbox]::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
input[type=checkbox]:checked{background:var(--cobalt)}
input[type=checkbox]:checked::after{transform:translateX(18px)}
.swatches{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:8px}
.sw{appearance:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--paper);box-shadow:0 0 0 1px var(--line);cursor:pointer;background:var(--c)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--cobalt)}
.xprev{height:84px;border-radius:6px;background:linear-gradient(180deg,#8aa6c4,#c9d1cd);display:flex;align-items:center;justify-content:center;margin:6px 0 4px;line-height:0}
.cm{grid-column:1/-1;color:var(--ink-2);font-size:13px;padding:6px 0 2px}

/* modals */
.modal{align-items:center;justify-content:center;background:rgba(9,13,20,.46);padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.card{background:var(--paper);color:var(--ink);width:min(560px,100%);max-height:100%;overflow-y:auto;border-radius:8px;padding:28px 30px;box-shadow:0 24px 70px rgba(0,0,0,.35)}
.ctitle{font-weight:900;font-stretch:118%;font-size:30px;line-height:1.05;letter-spacing:-.02em}
#pauseNote:empty{display:none}
#pauseNote{margin-top:8px;color:var(--danger)}
#pauseSettings{margin-top:12px;border-top:1px solid var(--line)}
.rscore{font-stretch:62%;font-weight:900;font-size:clamp(76px,17vw,124px);line-height:.92;margin-top:14px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.rstars{font-size:28px;margin-top:4px}
.pb{color:var(--ok);font-weight:700;margin-top:6px}
.rmetrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 20px;margin:22px 0 0}
.rmetrics dt{color:var(--ink-2);font-size:13px}
.rmetrics dd{margin:0;font-weight:800;font-stretch:84%;font-size:24px;line-height:1.15;font-variant-numeric:tabular-nums}
.unlock{margin-top:18px;padding:12px 14px;border-radius:6px;background:var(--fill);font-weight:600}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;display:none;z-index:5;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6),0 0 12px rgba(0,0,0,.25)}
#hud.on{display:block}
.htop{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);text-align:center}
#hTime{font-weight:800;font-stretch:62%;font-size:46px;line-height:1;font-variant-numeric:tabular-nums}
#hScore{font-weight:700;font-stretch:84%;font-size:20px;font-variant-numeric:tabular-nums;opacity:.95}
.hbl{position:absolute;left:calc(20px + env(safe-area-inset-left,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px))}
#hDrill{font-weight:800;font-stretch:112%;font-size:18px}
#hLive{font-size:14px;opacity:.9;font-variant-numeric:tabular-nums}
.hbr{position:absolute;right:calc(22px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));text-align:right}
#hAmmo{font-weight:800;font-stretch:62%;font-size:54px;line-height:1;font-variant-numeric:tabular-nums}
#hAmmo small{font-size:22px;opacity:.75;margin-left:4px}
#hGun{font-size:14px;opacity:.9}
.rbar{width:120px;height:4px;background:rgba(255,255,255,.3);margin:6px 0 0 auto;border-radius:2px;overflow:hidden;visibility:hidden}
.rbar i{display:block;height:100%;width:0;background:#fff}
#xhair{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);line-height:0}
#hitm{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;opacity:0;color:#fff}
#hitm.head{color:#FFC94A}
#hitm.show{animation:hm .2s ease-out}
@keyframes hm{0%{opacity:1;transform:scale(1.18)}100%{opacity:0;transform:scale(1)}}
#pops{position:absolute;left:50%;top:50%}
.pop{position:absolute;left:24px;top:-36px;white-space:nowrap;font-weight:800;font-stretch:84%;font-size:20px;animation:pop .85s ease-out forwards}
.pop.head{color:#FFC94A}
.pop.bad{color:#FF7D6E}
@keyframes pop{0%{opacity:0;transform:translateY(8px)}14%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-28px)}}
#cmsg{position:absolute;left:0;right:0;top:27%;text-align:center;padding:0 20px}
#cmsg .cd{font-weight:900;font-stretch:62%;font-size:110px;line-height:1}
#cmsg .ctl{font-weight:900;font-stretch:118%;font-size:30px;margin-top:6px}
#cmsg .cds{font-size:16px;max-width:44ch;margin:6px auto 0;opacity:.92}
#cmsg .mid{font-weight:800;font-stretch:112%;font-size:30px}
#cmsg .bad{color:#FF8A7B}
#scope{position:absolute;inset:0;display:none;background:radial-gradient(circle at 50% 50%,transparent 0,transparent calc(min(44vw,44vh) - 1px),rgba(0,0,0,.94) min(44vw,44vh))}
#scope.on{display:block}
#scope i{position:absolute;background:rgba(0,0,0,.9)}
#scope .h{left:0;right:0;top:50%;height:1px}
#scope .v{top:0;bottom:0;left:50%;width:1px}
#hurt{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 42%,rgba(210,40,28,.55));opacity:0;transition:opacity .45s}
#hurt.on{opacity:1;transition:none}
#notice{position:absolute;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(10,14,20,.72);padding:9px 14px;border-radius:5px;font-size:14px;text-shadow:none;width:max-content;max-width:min(540px,90vw);text-align:center;display:none}
#notice.on{display:block}
#fps{position:absolute;right:12px;top:calc(10px + env(safe-area-inset-top,0px));font-size:12px;opacity:.75;display:none;font-variant-numeric:tabular-nums}

/* touch */
#touch{display:none;position:fixed;inset:0;z-index:6;pointer-events:none}
body.touch.playing #touch{display:block}
#tpad{position:absolute;inset:0;pointer-events:auto;touch-action:none}
.tbtn{position:absolute;pointer-events:auto;touch-action:none;border-radius:50%;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.6);color:#fff;font-weight:700;font-size:13px;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.tbtn.on{background:rgba(255,255,255,.42)}
#tFire{width:96px;height:96px;right:calc(26px + env(safe-area-inset-right,0px));bottom:calc(112px + env(safe-area-inset-bottom,0px));font-size:16px}
#tScope{width:62px;height:62px;right:calc(140px + env(safe-area-inset-right,0px));bottom:calc(176px + env(safe-area-inset-bottom,0px))}
#tReload{width:58px;height:58px;right:calc(144px + env(safe-area-inset-right,0px));bottom:calc(98px + env(safe-area-inset-bottom,0px))}
#tPause{width:46px;height:46px;left:calc(14px + env(safe-area-inset-left,0px));top:calc(14px + env(safe-area-inset-top,0px));border-radius:6px}

@media (max-width:760px){
  .sheet{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto;border-right:0}
  .brand{padding:22px 20px 12px}
  #nav{flex-direction:row;overflow-x:auto;padding:0 12px;gap:4px;border-bottom:1px solid var(--line);scrollbar-width:none}
  #nav button{border-left:0;border-bottom:3px solid transparent;padding:10px 10px;font-size:16px;white-space:nowrap}
  #nav button[aria-current="true"]{border-bottom-color:var(--cobalt)}
  .pane{padding:14px 20px 28px}
  .foot{padding:10px 20px}
  .exlist{padding-left:0}
  .statgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .srow{grid-template-columns:minmax(0,1fr) auto}
  .srow input[type=range]{grid-column:1/-1;grid-row:2}
  .srow output{grid-column:2;grid-row:1}
  .srow .seg,.srow .swatches,.srow input[type=number]{grid-column:1/-1}
  .card{padding:22px 20px}
}
@media (prefers-reduced-motion: reduce){
  .pop,#hitm.show{animation-duration:.01s}
}
</style>
</head>
<body>
<canvas id="gl" aria-label="3D shooting range"></canvas>

<div id="hud" aria-hidden="true">
  <div class="htop"><div id="hTime">0:30</div><div id="hScore">0</div></div>
  <div class="hbl"><div id="hDrill"></div><div id="hLive"></div></div>
  <div class="hbr"><div id="hAmmo"></div><div id="hGun"></div><div class="rbar" id="rbar"><i></i></div></div>
  <div id="scope"><i class="h"></i><i class="v"></i></div>
  <div id="xhair"></div>
  <div id="hitm"><svg viewBox="-20 -20 40 40" width="40" height="40"><g stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="-12" y1="-12" x2="-5" y2="-5"/><line x1="12" y1="-12" x2="5" y2="-5"/><line x1="-12" y1="12" x2="-5" y2="5"/><line x1="12" y1="12" x2="5" y2="5"/></g></svg></div>
  <div id="pops"></div>
  <div id="cmsg"></div>
  <div id="hurt"></div>
  <div id="notice"></div>
  <div id="fps"></div>
</div>

<div id="touch">
  <div id="tpad"></div>
  <button class="tbtn" id="tPause" aria-label="Pause">II</button>
  <button class="tbtn" id="tScope">Scope</button>
  <button class="tbtn" id="tReload">Reload</button>
  <button class="tbtn" id="tFire">Fire</button>
</div>

<div id="menu" class="screen">
  <div class="sheet">
    <header class="brand">
      <h1 class="logo">Stillshot</h1>
      <p class="tag">Stand in one spot, pick a weapon, and train the aim you bring to every shooter.</p>
    </header>
    <nav id="nav" aria-label="Main menu">
      <button data-tab="path">The Path</button>
      <button data-tab="practice">Free practice</button>
      <button data-tab="armory">Armory</button>
      <button data-tab="stats">Stats</button>
      <button data-tab="settings">Settings</button>
    </nav>
    <section class="pane" id="pane"></section>
    <footer class="foot"><span id="fStars"></span><span id="fSave"></span><button class="linkbtn" id="fsBtn" hidden>Full screen</button></footer>
  </div>
</div>

<div id="pause" class="screen modal">
  <div class="card">
    <h2 class="ctitle">Paused</h2>
    <p id="pauseNote"></p>
    <div class="row">
      <button class="btn" data-pact="resume">Resume</button>
      <button class="btn ghost" data-pact="restart">Restart</button>

<script>
(function(){

/* ============================ helpers ============================ */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.prototype.slice.call(r.querySelectorAll(s));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

const D2R=Math.PI/180, EYE=1.6;
const clock=()=>performance.now()/1000;
const isTouch=matchMedia('(pointer: coarse)').matches && !matchMedia('(any-pointer: fine)').matches;
const fmtNum=n=>Math.round(n).toLocaleString('en-US');

const fmtSec=v=>(v||0).toFixed(1)+' s';
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const minOf=a=>a.length?Math.min.apply(null,a):0;
const acc=r=>r.shots?r.hits/r.shots:0;

const hex6=n=>'#'+n.toString(16).padStart(6,'0');

/* ============================ data ============================ */
const GUNS={
  pistol:{id:'pistol',name:'Marlin P9',kind:'Pistol',auto:false,rpm:400,mag:12,reload:1.3,dmg:34,head:3,pellets:1,spread:.12,bloom:.35,bloomMax:1.4,rv:.7,rh:.15,recover:10,vm:[.17,-.17,-.42]},

  rifle:{id:'rifle',name:'Kestrel AR',kind:'Rifle',auto:true,rpm:600,mag:30,reload:2.1,dmg:35,head:4,pellets:1,spread:.08,bloom:.06,bloomMax:.9,pattern:true,rv:.6,rh:.3,recover:6,vm:[.2,-.2,-.42]},

};
const GUN_ORDER=['pistol','smg','rifle','sniper','shotgun'];
const FINISHES=[
  {id:'factory',name:'Factory',body:0x3b4149,accent:0x1e2228,req:0},

/* score helpers shared by drills */
const accScore=r=>Math.round(r.raw*(.6+.4*acc(r)));
const accLine=r=>'Accuracy '+(r.shots?pct(acc(r)):'–');
const lt=r=>r.elapsed+(r.state==='live'&&!r.paused?Math.min(.05,clock()-frameStamp):0);

/* ============================ drills ============================ */
const DRILLS={
grid:{name:'Grid',skill:'Speed and precision',gun:'pistol',
  desc:'Three targets sit on the board. Hit one and it jumps somewhere new. Quick kills earn a bonus, misses cost you.',
  setup(r){ const s=r.close?.55:1; r.gd=r.close?6.5:11.6; r.cells=[];
    for(let i=0;i<5;i++) for(let j=0;j<4;j++) r.cells.push([(i-2)*1.25*s,(j-1.5)*.85*s]);
    r.occ=new Set(); r.lastKill=0; for(let k=0;k<3;k++) this.spawn(r); },
  spawn(r){ let idx,n=0; do{ idx=Math.floor(Math.random()*r.cells.length); n++; }while(r.occ.has(idx)&&n<60);
    r.occ.add(idx); const c=r.cells[idx]; const t=makeBall(r.close?.21:.32); t.cell=idx;
    t.root.position.set(c[0],EYE+c[1],-r.gd); addTarget(t); },
  hit(r,t){ const tm=lt(r), gap=tm-r.lastKill; r.lastKill=tm; r.ttks.push(gap);
    const pts=100+clamp(Math.round((.55-gap)*120),0,50); r.raw+=pts; r.kills++; popup('+'+pts);
    kill(t); this.spawn(r); r.occ.delete(t.cell); },
  score:accScore, live:accLine,
  metrics:r=>[['Hits',fmtNum(r.kills)],['Accuracy',pct(acc(r))],['Avg time per kill',fmtMs(avg(r.ttks))],['Shots fired',fmtNum(r.shots)]]
},
snap:{name:'Snap',skill:'Flicking',gun:'pistol',
  desc:'One target at a time, anywhere across a wide arc. Get there fast and click once.',
  setup(r){ const sn=r.gun.id==='sniper'; r.sd=sn?26:(r.close?7:10.5); r.sr=sn?.42:(r.hard?.22:.3)*(r.close?.7:1); r.py=0; this.spawn(r); },
  spawn(r){ let y,n=0; do{ y=rand(-38,38); n++; }while(Math.abs(y-r.py)<12&&n<40); r.py=y;
    const t=makeBall(r.sr); t.root.position.copy(spawnPos(y,rand(-9,14),r.sd)); t.spawnAt=lt(r); addTarget(t); },
  hit(r,t){ const rt=lt(r)-t.spawnAt; r.ttks.push(rt); const pts=100+clamp(Math.round(150*(1-(rt-.3)/.9)),0,150);
    r.raw+=pts; r.kills++; popup('+'+pts); kill(t); this.spawn(r); },
  score:accScore, live:accLine,
  metrics:r=>[['Targets hit',fmtNum(r.kills)],['Accuracy',pct(acc(r))],['Avg time per target',fmtMs(avg(r.ttks))],['Fastest',fmtMs(minOf(r.ttks))]]
},
pinpoint:{name:'Pinpoint',skill:'Micro adjustment',gun:'pistol',
  desc:'Tiny targets close to your crosshair. Small, careful corrections win here, not big swings.',
  setup(r){ r.pr=(r.hard?.085:.11)*(r.close?.75:1); r.pd=r.close?7:9; r.lp=[0,0]; this.spawn(r); },
  spawn(r){ let y,p,n=0; do{ y=rand(-12,12); p=rand(-6,8); n++; }while(Math.hypot(y-r.lp[0],p-r.lp[1])<3&&n<40); r.lp=[y,p];
    const t=makeBall(r.pr); t.root.position.copy(spawnPos(y,p,r.pd)); t.spawnAt=lt(r); addTarget(t); },
  hit(r,t){ const rt=lt(r)-t.spawnAt; r.ttks.push(rt); const pts=120+clamp(Math.round(40*(1-(rt-.25)/.6)),0,40);
    r.raw+=pts; r.kills++; popup('+'+pts); kill(t); this.spawn(r); },
  score:accScore, live:accLine,
  metrics:r=>[['Targets hit',fmtNum(r.kills)],['Accuracy',pct(acc(r))],['Avg time per target',fmtMs(avg(r.ttks))],['Fastest',fmtMs(minOf(r.ttks))]]
},
track:{name:'Track',skill:'Tracking',gun:'smg',
  desc:'An orb strafes across the range. Hold fire and keep your crosshair on it. It glows while you are on target.',
  setup(r){ r.td=r.close?7:11; const t=makeBall((r.hard?.3:.38)*(r.close?.75:1)); t.vx=0; t.vy=0; t.vyT=0; t.dir=1; t.nextTurn=0;
    t.root.position.set(0,EYE+.3,-r.td); addTarget(t); r.orb=t; r.speed=(r.hard?4.6:3.2)*(r.close?.7:1); r.lock=0; r.bestLock=0; },
  tick(r,dt){ const t=r.orb; if(r.state!=='live'||!t) return; const p=t.root.position, lim=r.close?3:4.6;
    if(r.elapsed>=t.nextTurn){ t.dir=Math.random()<.5?-1:1; t.nextTurn=r.elapsed+rand(r.hard?.2:.3,r.hard?.7:1.1); t.vyT=rand(-1,1)*(r.hard?1.6:1); }
    if(p.x>lim) t.dir=-1; if(p.x<-lim) t.dir=1;
    t.vx=lerp(t.vx,t.dir*r.speed,1-Math.exp(-dt*(r.hard?9:6))); p.x+=t.vx*dt;
    t.vy=lerp(t.vy,t.vyT,1-Math.exp(-dt*3)); p.y+=t.vy*dt;
    if(p.y<EYE-.9){p.y=EYE-.9;t.vyT=Math.abs(t.vyT);} if(p.y>EYE+1.6){p.y=EYE+1.6;t.vyT=-Math.abs(t.vyT);}
    if(input.trigger){ r.firing+=dt; const on=rayHits(t); t.lit=on;
      if(on){ r.onTarget+=dt; r.lock+=dt; if(r.lock>r.bestLock) r.bestLock=r.lock; } else r.lock=0;
    } else { t.lit=false; r.lock=0; } },
  hit(){},
  score:r=>Math.round(r.onTarget/Math.max(r.dur,1)*10000),
  live:r=>'On target '+pct(r.elapsed?r.onTarget/r.elapsed:0),
  metrics:r=>[['On target',pct(r.onTarget/r.dur)],['Accuracy while firing',pct(r.firing?r.onTarget/r.firing:0)],['Longest lock',fmtSec(r.bestLock)],['Time firing',fmtSec(r.firing)]]
},
duel:{name:'Duel',skill:'Strafe aim',gun:'rifle',
  desc:'A strafing bot draws on you. Drop it before its visor lights up and it fires. Headshots score extra.',
  setup(r){ r.dd=r.close?6.5:12; r.ds=(r.hard?4.8:3.6)*(r.close?.75:1); r.draw=r.hard?1.6:(r.close?2:2.4); r.bot=null; r.respawnAt=0; this.spawn(r); },
  spawn(r){ const b=makeBot(); const lim=r.close?2.4:3.8; b.root.position.set(rand(-lim,lim),0,-r.dd); b.spawnAt=lt(r);
    b.dir=Math.random()<.5?-1:1; b.vx=0; b.nextTurn=r.elapsed+rand(.25,.8); b.crouch=0; b.crouchUntil=0; addTarget(b); r.bot=b; },
  tick(r,dt){ if(r.state!=='live') return; const b=r.bot;
    if(!b){ if(r.respawnAt&&r.elapsed>=r.respawnAt){ r.respawnAt=0; this.spawn(r); } return; }
    const lim=r.close?2.6:4.2, p=b.root.position;
    if(r.elapsed>=b.nextTurn){ b.dir=Math.random()<.5?-1:1; b.nextTurn=r.elapsed+rand(r.hard?.18:.25,r.hard?.6:.85); }
    if(p.x>lim) b.dir=-1; if(p.x<-lim) b.dir=1;
    b.vx=lerp(b.vx,b.dir*r.ds,1-Math.exp(-dt*12)); p.x+=b.vx*dt;
    if(r.hard&&r.elapsed>b.crouchUntil+.6&&Math.random()<dt*.7) b.crouchUntil=r.elapsed+.45;
    b.crouch=lerp(b.crouch,r.elapsed<b.crouchUntil?1:0,1-Math.exp(-dt*14)); b.upper.position.y=.86-b.crouch*.32;
    const prog=clamp((r.elapsed-b.spawnAt)/r.draw,0,1);
    b.arm.rotation.x=-Math.min(1,prog*1.4)*Math.PI/2; b.visor.emissiveIntensity=.15+prog*prog*3.2;
    if(prog>=1){ r.deaths++; r.raw-=150; popup('-150','bad'); hurt(); sfx.hurt(); kill(b,false); r.bot=null; r.respawnAt=r.elapsed+.7; } },
  hit(r,t,part,dmg){ t.hp-=dmg; t.flash=1; if(t.hp>0) return;
    const tt=lt(r)-t.spawnAt, head=part==='head'; r.ttks.push(tt);
    const pts=300+(head?150:0)+clamp(Math.round((1-tt/r.draw)*150),0,150); r.raw+=pts; r.kills++; if(head) r.headKills++;
    popup('+'+pts,head?'head':''); sfx.kill(); kill(t); r.bot=null; r.respawnAt=r.elapsed+.45; },
  score:r=>Math.max(0,Math.round(r.raw)),
  live:r=>'Kills '+r.kills+'    Shot '+r.deaths,
  metrics:r=>[['Kills',fmtNum(r.kills)],['Times shot',fmtNum(r.deaths)],['Headshot kills',r.kills?pct(r.headKills/r.kills):'–'],['Avg time to kill',fmtMs(avg(r.ttks))],['Accuracy',pct(acc(r))],['Headshot hits',r.bHits?pct(r.bHeads/r.bHits):'–']]
},
quickdraw:{name:'Quickdraw',skill:'Reaction time',gun:'pistol',rounds:true,
  desc:'Wait for it. A target appears after a random delay, so shoot the moment you see it. Shooting early resets the round.',
  setup(r){ r.round=0; r.total=r.dur; r.phase='pre'; r.falseStarts=0; },
  start(r){ this.wait(r); },
  wait(r){ r.phase='wait'; r.waitUntil=r.elapsed+rand(1,2.8); msg('<div class="mid">Wait for it</div>',0); },
  tick(r){ if(r.state!=='live') return;
    if(r.phase==='wait'&&r.elapsed>=r.waitUntil){ r.phase='show'; const t=makeBall(r.hard?.24:.32);
      t.root.position.copy(spawnPos(rand(-14,14),rand(-7,9),10)); t.spawnAt=lt(r); t.born=now-.06; addTarget(t); msg('',0); } },
  preShot(r){ if(r.phase==='wait'){ r.falseStarts++; msg('<div class="mid bad">Too early</div>',800); r.waitUntil=r.elapsed+rand(1.3,2.8); return 'void'; }
    if(r.phase!=='show') return 'void'; },
  hit(r,t){ const rt=lt(r)-t.spawnAt; r.reacts.push(rt); const pts=clamp(Math.round(1000-(rt-.18)*1600),0,1000); r.raw+=pts;
    popup(Math.round(rt*1000)+' ms'); kill(t); r.round++; if(r.round>=r.total){ r.phase='done'; r.finish=true; } else this.wait(r); },
  score:r=>Math.round(r.raw),
  live:r=>'Last '+(r.reacts.length?Math.round(r.reacts[r.reacts.length-1]*1000)+' ms':'–'),
  metrics:r=>[['Avg reaction',fmtMs(avg(r.reacts))],['Best',fmtMs(minOf(r.reacts))],['Early shots',fmtNum(r.falseStarts)],['Accuracy',pct(acc(r))]]
},
farlane:{name:'Far lane',skill:'Long range',gun:'sniper',
  desc:'Steel plates from 35 to 58 meters. Scope in with right click, settle, then squeeze.',
  setup(r){ r.lanes=[]; for(const x of [-12,-7,-2.5,2.5,7,12]) for(const z of [35,42,50,58]) r.lanes.push([x,z]);
    r.occ=new Set(); r.pending=[]; r.longest=0; this.spawn(r); this.spawn(r); },
  spawn(r){ let i,n=0; do{ i=Math.floor(Math.random()*r.lanes.length); n++; }while(r.occ.has(i)&&n<60); r.occ.add(i);
    const L=r.lanes[i]; const t=makePlate(.42); t.root.position.set(L[0],0,-L[1]); t.dist=L[1]; t.lane=i; t.spawnAt=lt(r);
    if(r.hard) t.slide=rand(.6,1.2)*(Math.random()<.5?-1:1); addTarget(t); },
  tick(r,dt){ if(r.state!=='live') return;
    for(const t of r.targets){ if(t.slide){ const p=t.root.position; p.x+=t.slide*dt; if(p.x>14) t.slide=-Math.abs(t.slide); if(p.x<-14) t.slide=Math.abs(t.slide); } }
    for(let i=r.pending.length-1;i>=0;i--) if(r.elapsed>=r.pending[i]){ r.pending.splice(i,1); this.spawn(r); } },
  hit(r,t){ const tt=lt(r)-t.spawnAt; r.ttks.push(tt); const pts=150+Math.round(t.dist*2)+clamp(Math.round((2-tt)*40),0,80);
    r.raw+=pts; r.kills++; r.longest=Math.max(r.longest,t.dist); popup('+'+pts); sfx.ping(); dropPlate(t); r.occ.delete(t.lane); r.pending.push(r.elapsed+.35); },
  score:accScore, live:accLine,
  metrics:r=>[['Plates hit',fmtNum(r.kills)],['Accuracy',pct(acc(r))],['Avg time per plate',fmtMs(avg(r.ttks))],['Farthest hit',r.longest?r.longest+' m':'–']]
},
spray:{name:'Spray wall',skill:'Recoil control',gun:'rifle',
  desc:'Hold fire on the bullseye and pull down against the kick. The card clears every time you reload.',
  setup(r){ drawCard(); r.onCard=0; r.distSum=0; r.bulls=0; },
  hitSpray(r,uv){ const dx=(uv.x-.5)*SPRAY, dy=(uv.y-.5)*SPRAY, d=Math.hypot(dx,dy);
    r.raw+=Math.max(0,Math.round(100*(1-d/1.4))); r.onCard++; r.distSum+=d; if(d<.12) r.bulls++; hole(uv); },
  onReload(){ drawCard(); },
  hit(){},
  score:r=>Math.round(r.raw), live:r=>'On card '+(r.shots?pct(r.onCard/r.shots):'–'),
  metrics:r=>[['Bullets on card',fmtNum(r.onCard)],['Accuracy',pct(acc(r))],['Avg distance from center',r.onCard?Math.round(r.distSum/r.onCard*100)+' cm':'–'],['Bullseyes',fmtNum(r.bulls)]]
},
sweep:{name:'Sweep',skill:'Target switching',gun:'smg',
  desc:'Waves of five targets that each take a few hits. Clear the wave fast for a bonus, then the next one appears.',
  setup(r){ r.wd=r.close?6.5:11; r.wave=0; r.waveTimes=[]; r.nextWaveAt=0; r.left=0; this.wave(r); },
  wave(r){ const ys=[]; let n=0; while(ys.length<5&&n<200){ const y=rand(-32,32); n++; if(ys.every(o=>Math.abs(o-y)>9)) ys.push(y); }
    for(const y of ys){ const t=makeBall(r.close?.28:.36); t.hp=t.maxHp=60; t.root.position.copy(spawnPos(y,rand(-6,10),r.wd));
      if(r.hard) t.drift=rand(-1,1)*.8; addTarget(t); }
    r.waveStart=lt(r); r.left=ys.length; },
  tick(r,dt){ if(r.state!=='live') return;
    if(r.hard) for(const t of r.targets){ if(t.drift){ t.root.position.x+=t.drift*dt; if(Math.abs(t.root.position.x)>8) t.drift*=-1; } }
    if(r.left===0&&r.nextWaveAt&&r.elapsed>=r.nextWaveAt){ r.nextWaveAt=0; this.wave(r); } },
  hit(r,t,part,dmg){ if(t.lastShot!==r.shotId){ t.lastShot=r.shotId; r.raw+=40; }
    t.hp-=dmg; t.flash=1; t.sizeMul=.72+.28*Math.max(0,t.hp)/t.maxHp; if(t.hp>0) return;
    r.raw+=100; r.kills++; kill(t); r.left--;
    if(r.left===0){ const wt=lt(r)-r.waveStart; r.waveTimes.push(wt); r.wave++; const b=200+clamp(Math.round(300-wt*60),0,300);
      r.raw+=b; popup('Wave +'+b); sfx.kill(); r.nextWaveAt=r.elapsed+.35; } },
  score:accScore, live:r=>'Wave '+(r.wave+1)+'    '+accLine(r),
  metrics:r=>[['Waves cleared',fmtNum(r.wave)],['Avg wave time',r.waveTimes.length?fmtSec(avg(r.waveTimes)):'–'],['Accuracy',pct(acc(r))],['Targets down',fmtNum(r.kills)]]
}
};

const KEY='stillshot.save.v1';
function freshSave(){ return {v:1,updatedAt:0,
  settings:{game:'valorant',sens:.4,dpi:800,raw:true,fov:103,scopeMult:1,adsMode:'hold',xStyle:'cross',xColor:'#FFFFFF',xSize:7,xThick:2,xGap:4,xOutline:true,
    targetColor:'cobalt',theme:'auto',volume:.7,hitSound:true,showFps:false,practiceReloads:true,quality:'high',touchSens:1},
  stars:{},best:{},pbs:{},history:[],totals:{runs:0,shots:0,hits:0,time:0,bHits:0,bHeads:0,bestReact:0},
  gun:'pistol',finish:{},practice:{drill:'grid',gun:'pistol',dur:60,diff:'normal'}}; }
function normalize(s){ const d=freshSave(); if(!s||typeof s!=='object') return d;
  const o=Object.assign(d,s);
  o.settings=Object.assign(freshSave().settings,s.settings||{});
  o.totals=Object.assign(freshSave().totals,s.totals||{});
  o.practice=Object.assign(freshSave().practice,s.practice||{});
  for(const k of ['stars','best','pbs','finish']) if(!o[k]||typeof o[k]!=='object') o[k]={};
  if(!Array.isArray(o.history)) o.history=[];
  if(!GUNS[o.gun]) o.gun='pistol';
  if(!DRILLS[o.practice.drill]) o.practice.drill='grid';
  if(!GUNS[o.practice.gun]) o.practice.gun='pistol';
  if(!YAW[o.settings.game]) o.settings.game='valorant';
  return o; }
function loadLocal(){ try{ const raw=localStorage.getItem(KEY); if(raw) return normalize(JSON.parse(raw)); }catch(e){} return freshSave(); }
let save=loadLocal();
const cloud={ref:null,busy:false,pending:false,timer:0,on:false,remote:null};
function persist(){ save.updatedAt=Date.now(); try{ localStorage.setItem(KEY,JSON.stringify(save)); }catch(e){} scheduleCloud(); }
function scheduleCloud(){ if(!cloud.ref) return; clearTimeout(cloud.timer); cloud.timer=setTimeout(pushCloud,1200); }
async function pushCloud(){ if(!cloud.ref) return; if(cloud.busy){ cloud.pending=true; return; } cloud.busy=true;
  try{ await cloud.ref.set({blob:JSON.stringify(save),updatedAt:save.updatedAt}); cloud.on=true; }
  catch(e){ const c=e&&e.code; if(c==='unavailable'){ setTimeout(()=>{ if(cloud.ref) pushCloud(); },1500+Math.random()*1500); }
    else { cloud.ref=null; cloud.on=false; } }
  cloud.busy=false; if(cloud.pending){ cloud.pending=false; pushCloud(); } updateFoot(); }
async function initCloud(){
  if(!window.claude||typeof window.claude.use!=='function') return;
  try{
    const res=await Promise.all([window.claude.use('db'),window.claude.use('user')]); const db=res[0], user=res[1];
    if(!db||!user) return; const uid=await user.id(); if(!uid) return;
    const ref=db.doc('data/users/'+uid+'/save'); const snap=await ref.get(); cloud.ref=ref; cloud.on=true;
    let remote=null; if(snap.exists){ const d=snap.data(); try{ remote=d&&d.blob?normalize(JSON.parse(d.blob)):null; }catch(e){} }
    if(remote&&remote.updatedAt>save.updatedAt){ if(run) cloud.remote=remote; else adoptRemote(remote); }
    else if(save.updatedAt>0) pushCloud();
    updateFoot();
  }catch(e){ cloud.ref=null; cloud.on=false; }
}
function adoptRemote(r){ save=r; cloud.remote=null; try{ localStorage.setItem(KEY,JSON.stringify(save)); }catch(e){} applyAllSettings(); if(!run){ setGun(save.gun); renderPane(); updateFoot(); } }
function totalStars(){ let n=0; for(const k in save.stars) n+=save.stars[k]||0; return n; }
function chapterStars(c){ return CHAPTERS[c].ex.reduce((a,_,e)=>a+(save.stars['c'+c+'e'+e]||0),0); }
function chapterOpen(c){ return totalStars()>=CHAPTERS[c].req; }
function pbKey(s){ return s.drill+'|'+s.gun+'|'+s.dur+'|'+(s.diff||'normal'); }
function finishOf(id){ const f=FINISHES.find(x=>x.id===(save.finish[id]||'factory')); return f||FINISHES[0]; }

/* ============================ audio ============================ */
const sfx=(function(){
  let ctx=null, master=null, noise=null;
  function init(){ if(ctx){ if(ctx.state==='suspended') ctx.resume(); return; }
    try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); master=ctx.createGain(); master.gain.value=save.settings.volume; master.connect(ctx.destination);
      noise=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate); const d=noise.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }catch(e){ ctx=null; } }
  function env(g,t,a,p,dec){ g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(p,t+a); g.gain.exponentialRampToValueAtTime(.0001,t+a+dec); }
  function nz(o){ const t=ctx.currentTime+(o.delay||0); const s=ctx.createBufferSource(); s.buffer=noise; const f=ctx.createBiquadFilter();
    f.type=o.type||'lowpass'; f.frequency.value=o.freq||2000; f.Q.value=o.q||.7; const g=ctx.createGain(); env(g,t,.002,o.peak||.5,o.dec||.1);
    s.connect(f); f.connect(g); g.connect(master); s.start(t,Math.random()*.5); s.stop(t+(o.dec||.1)+.06); }
  function tn(o){ const t=ctx.currentTime+(o.delay||0); const os=ctx.createOscillator(); os.type=o.type||'sine'; os.frequency.setValueAtTime(o.f0,t);
    if(o.f1) os.frequency.exponentialRampToValueAtTime(o.f1,t+o.dur); const g=ctx.createGain(); env(g,t,.003,o.peak||.2,o.dur);
    os.connect(g); g.connect(master); os.start(t); os.stop(t+o.dur+.06); }
  const shots={
    pistol(){ nz({freq:3200,peak:.5,dec:.09}); tn({f0:170,f1:60,dur:.08,peak:.42}); nz({freq:900,peak:.1,dec:.26,delay:.02}); },
    smg(){ nz({freq:2700,peak:.34,dec:.06}); tn({f0:150,f1:70,dur:.05,peak:.26}); },
    rifle(){ nz({freq:2400,peak:.48,dec:.1}); tn({f0:125,f1:45,dur:.09,peak:.46}); nz({freq:700,peak:.1,dec:.3,delay:.03}); },
    sniper(){ nz({freq:1800,peak:.75,dec:.22}); tn({f0:92,f1:34,dur:.2,peak:.66}); nz({freq:520,peak:.2,dec:.8,delay:.06}); },
    shotgun(){ nz({freq:1500,peak:.8,dec:.18}); tn({f0:82,f1:34,dur:.16,peak:.66}); nz({freq:600,peak:.18,dec:.5,delay:.05}); }
  };
  const ok=()=>!!ctx;
  return {init,
    setVol(v){ if(master) master.gain.value=v; },
    shot(id){ if(ok()) shots[id](); },
    hit(){ if(ok()) tn({f0:1650,dur:.045,peak:.2,type:'triangle'}); },
    head(){ if(ok()){ tn({f0:2300,dur:.12,peak:.2}); tn({f0:3100,dur:.16,peak:.12,delay:.03}); } },
    kill(){ if(ok()) tn({f0:620,f1:1240,dur:.12,peak:.15,type:'triangle'}); },
    ping(){ if(ok()){ tn({f0:1760,dur:.35,peak:.18}); tn({f0:2650,dur:.25,peak:.1}); } },
    empty(){ if(ok()) nz({freq:4200,type:'highpass',peak:.25,dec:.03}); },
    reload(){ if(ok()){ nz({freq:2600,type:'bandpass',q:5,peak:.35,dec:.04}); nz({freq:3400,type:'bandpass',q:5,peak:.35,dec:.05,delay:.38}); } },
    beep(hi){ if(ok()) tn({f0:hi?1320:880,dur:hi?.22:.1,peak:.16}); },
    hurt(){ if(ok()){ nz({freq:450,peak:.6,dec:.3}); tn({f0:210,f1:60,dur:.24,peak:.3,type:'sawtooth'}); } }
  };
})();

  catch(e){ plain(); }

  if(ds.act==='practice'){ startRun({drill:P.drill,gun:P.gun,dur:P.dur,diff:P.diff,path:null}); return; }
  if(ds.agun){ ui.agun=ds.agun; setGun(ds.agun); renderPane(); return; }
  if(ds.fin){ const id=ui.agun||save.gun; save.finish[id]=ds.fin; persist(); setGun(id); renderPane(); return; }
  if(ds.act==='equip'){ save.gun=ui.agun||save.gun; save.practice.gun=save.gun; persist(); renderPane(); return; }
  if(ds.act==='gopath'){ ui.tab='path'; renderPane(); } });

/* ============================ settings UI ============================ */
const FMT={scopeMult:v=>(+v).toFixed(2)+'×',touchSens:v=>(+v).toFixed(2)+'×',fov:v=>v+'°',xSize:v=>v+' px',xThick:v=>v+' px',xGap:v=>v+' px',volume:v=>Math.round(v*100)+'%'};
function sRange(k,label,min,max,step){ const v=save.settings[k]; return '<label class="srow"><span>'+label+'</span><input type="range" data-s="'+k+'" min="'+min+'" max="'+max+'" step="'+step+'" value="'+v+'"><output>'+FMT[k](v)+'</output></label>'; }
function sSeg(k,label,opts){ return '<div class="srow"><span>'+label+'</span><div class="seg" data-sseg="'+k+'">'+opts.map(o=>'<button type="button" data-v="'+o[0]+'" aria-pressed="'+(String(save.settings[k])===String(o[0]))+'">'+o[1]+'</button>').join('')+'</div></div>'; }
function sTog(k,label){ return '<label class="srow tog"><span>'+label+'</span><input type="checkbox" data-s="'+k+'"'+(save.settings[k]?' checked':'')+'></label>'; }
function sSw(k,label,opts){ return '<div class="srow"><span>'+label+'</span><div class="swatches">'+opts.map(o=>'<button type="button" class="sw" data-sw="'+k+'" data-v="'+o[0]+'" aria-label="'+o[1]+'" aria-pressed="'+(save.settings[k]===o[0])+'" style="--c:'+o[2]+'"></button>').join('')+'</div></div>'; }
function settingsHTML(){ const s=save.settings, cust=s.game==='custom';
  return '<div class="sgroup"><h3>Mouse</h3>'+
    sSeg('game','Match a game',[['valorant','Valorant'],['cs2','CS2 or Apex'],['overwatch','Overwatch 2'],['custom','Custom']])+
    '<label class="srow"><span>'+(cust?'Degrees per count':'In-game sensitivity')+'</span><input type="number" data-s="sens" min="0.0001" max="200" step="'+(cust?'0.0001':'0.01')+'" value="'+s.sens+'"></label>'+
    '<label class="srow"><span>Mouse DPI</span><input type="number" data-s="dpi" min="100" max="32000" step="50" value="'+s.dpi+'"></label>'+
    '<p class="cm">'+cmText()+'</p>'+
    sRange('scopeMult','Scoped sensitivity',.2,2,.05)+sSeg('adsMode','Scope button',[['hold','Hold'],['toggle','Toggle']])+
    sTog('raw','Raw input, skipping system acceleration')+(isTouch?sRange('touchSens','Touch sensitivity',.3,3,.05):'')+'</div>'+
  '<div class="sgroup"><h3>View</h3>'+sRange('fov','Field of view',70,120,1)+sSeg('quality','Graphics',[['high','High'],['low','Low']])+sTog('showFps','Show frame rate')+'</div>'+
  '<div class="sgroup"><h3>Crosshair</h3><div class="xprev"></div>'+
    sSeg('xStyle','Shape',[['cross','Cross'],['crossdot','Cross and dot'],['dot','Dot'],['circle','Circle']])+
    sSw('xColor','Color',XCOLORS.map(c=>[c[0],c[1],c[0]]))+sRange('xSize','Length',2,20,1)+sRange('xThick','Thickness',1,6,1)+sRange('xGap','Gap',0,12,1)+sTog('xOutline','Outline')+'</div>'+
  '<div class="sgroup"><h3>Range</h3>'+sSeg('theme','Time of day',[['auto','Match system'],['day','Day'],['dusk','Dusk'],['night','Night']])+
    sSw('targetColor','Target color',Object.keys(TCOLORS).map(k=>[k,k.charAt(0).toUpperCase()+k.slice(1),hex6(TCOLORS[k])]))+'</div>'+
  '<div class="sgroup"><h3>Sound</h3>'+sRange('volume','Volume',0,1,.05)+sTog('hitSound','Hit sounds')+'</div>'+
  '<div class="sgroup"><h3>Gameplay</h3>'+sTog('practiceReloads','Reloads in free practice')+'</div>'+
  '<div class="sgroup"><h3>Progress</h3><p class="note">'+(cloud.on?'Your progress saves to your account automatically after every run.':'Your progress saves in this browser automatically after every run.')+'</p><div class="row"><button class="btn ghost danger" data-reset="1">Reset all progress</button></div></div>'; }
function renderXPrev(root){ const el=$('.xprev',root); if(el) renderCrosshair(el); }
function setSetting(k,v){ save.settings[k]=v; applySetting(k); persist(); }
function wireSettings(root){
  root.addEventListener('input',e=>{ const el=e.target, k=el.dataset&&el.dataset.s; if(!k) return; let v;
    if(el.type==='checkbox') v=el.checked; else { v=parseFloat(el.value); if(!(v>0)&&!(el.type==='range'&&v===0)) return; }
    if(k==='dpi') v=Math.round(v);
    setSetting(k,v); const out=el.parentElement.querySelector('output'); if(out&&FMT[k]) out.textContent=FMT[k](v);
    if(k==='sens'||k==='dpi'){ const cm=$('.cm',root); if(cm) cm.textContent=cmText(); }
    if(k.charAt(0)==='x') renderXPrev(root); });
  root.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return;
    const sg=b.closest('[data-sseg]');
    if(sg){ const k=sg.dataset.sseg, v=b.dataset.v;
      if(k==='game'){ const dpc=degPerCount(); save.settings.game=v; save.settings.sens=v==='custom'?+dpc.toFixed(4):+(dpc/YAW[v]).toFixed(3); persist();
        const st=root.scrollTop; root.innerHTML=settingsHTML(); renderXPrev(root); root.scrollTop=st; return; }
      setSetting(k,v); for(const x of sg.children) x.setAttribute('aria-pressed',String(x===b)); if(k.charAt(0)==='x') renderXPrev(root); return; }
    if(b.dataset.sw){ setSetting(b.dataset.sw,b.dataset.v); for(const x of b.parentElement.children) x.setAttribute('aria-pressed',String(x===b)); renderXPrev(root); return; }
    if(b.dataset.reset){ if(b.dataset.armed){ const keep=save.settings; save=freshSave(); save.settings=keep; persist(); ui.chap=-2; updateFoot();
        if(!run) setGun(save.gun); b.textContent='Progress reset'; b.disabled=true; delete b.dataset.armed; }
      else { b.dataset.armed='1'; b.textContent='Click again to erase stars, bests and stats'; setTimeout(()=>{ if(b.dataset.armed){ delete b.dataset.armed; b.textContent='Reset all progress'; } },4000); } } });
}

/* full screen */
(function(){ const b=$('#fsBtn'); if(!document.fullscreenEnabled||isTouch) return; b.hidden=false;
  b.addEventListener('click',()=>{ try{ if(document.fullscreenElement) document.exitFullscreen(); else { const p=document.documentElement.requestFullscreen(); if(p&&p.catch) p.catch(()=>{ b.hidden=true; }); } }catch(e){ b.hidden=true; } }); })();

/* ============================ HUD ============================ */
const hudCache={};
function setText(id,v){ if(hudCache[id]!==v){ hudCache[id]=v; document.getElementById(id).textContent=v; } }
function setHTML(id,v){ if(hudCache[id]!==v){ hudCache[id]=v; document.getElementById(id).innerHTML=v; } }
function updateHud(){ const r=run; if(!r||r.state==='done') return; const d=r.drill;
  if(r.timed){ const left=Math.max(0,r.dur-r.elapsed); setText('hTime',left<10?left.toFixed(1):Math.floor(left/60)+':'+String(Math.floor(left%60)).padStart(2,'0')); }
  else setText('hTime',Math.min(r.round+1,r.total)+' / '+r.total);
  setText('hScore',fmtNum(d.score(r))); setText('hLive',d.live(r));
  setHTML('hAmmo',r.infAmmo?'∞':W.ammo+'<small>/ '+W.gun.mag+'</small>');
  const rb=$('#rbar'); if(W.reloading){ rb.style.visibility='visible'; rb.firstChild.style.width=Math.round(clamp((now-W.reloadStart)/W.gun.reload,0,1)*100)+'%'; } else rb.style.visibility='hidden';
  const scoped=!!W.gun.zoom&&W.adsT>.85; $('#scope').classList.toggle('on',scoped); $('#xhair').style.visibility=scoped?'hidden':'visible';
  $('#tScope').classList.toggle('on',W.ads); }

/* ============================ resize ============================ */
function resize(){ const w=innerWidth, h=innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; vmCam.aspect=w/h; vmCam.updateProjectionMatrix(); }
addEventListener('resize',resize);
try{ const mq=matchMedia('(prefers-color-scheme: dark)'), onMq=()=>{ if(save.settings.theme==='auto') applyTheme(); }; if(mq.addEventListener) mq.addEventListener('change',onMq); else if(mq.addListener) mq.addListener(onMq); }catch(e){}
new MutationObserver(()=>{ if(save.settings.theme==='auto') applyTheme(); }).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

/* ============================ main loop ============================ */
let fpsN=0, fpsT=0, last=clock();
function updateFx(dt){
  for(const m of parts){ if(!m.visible) continue; const u=m.userData; u.life-=dt; if(u.life<=0){ m.visible=false; continue; } u.v.y-=9.8*dt; m.position.addScaledVector(u.v,dt); m.rotation.x+=dt*8; m.rotation.y+=dt*6; }
  for(const m of tracers){ if(!m.visible) continue; m.userData.life-=dt; m.material.opacity=Math.max(0,m.userData.life/.055)*.85; if(m.userData.life<=0) m.visible=false; }
  flashLife-=dt; if(flashLife<=0) flashSprite.visible=false; muzzleLight.intensity=Math.max(0,muzzleLight.intensity-dt*60); vmFlashLight.intensity=flashSprite.visible?1.5:0;
  if(VM.group) vmFlashLight.position.copy(VM.group.userData.muzzle).applyMatrix4(VM.group.matrixWorld);
  for(let i=fallers.length-1;i>=0;i--){ const f=fallers[i], p=clamp((now-f.t0)/.3,0,1); f.t.pivot.rotation.x=-p*p*Math.PI/2*.94; if(now-f.t0>1.3){ disposeT(f.t); fallers.splice(i,1); } } }
function updateTargets(dt){ if(!run) return; for(const t of run.targets){ const s=Math.max(.001,Math.min(1,(now-t.born)/.07));
  if(t.kind==='ball'){ t.root.scale.setScalar(s*t.sizeMul); t.mats[0].emissiveIntensity=(t.lit?.9:.18)+t.flash*1.3; }
  else if(t.kind==='bot'){ t.root.scale.setScalar(s); t.acc.emissiveIntensity=.15+t.flash*1.6; t.root.lookAt(camera.position.x,t.root.position.y,camera.position.z); }
  else { t.root.scale.setScalar(s); t.mats[0].emissiveIntensity=.12+t.flash; }
  t.flash=Math.max(0,t.flash-dt*10); } }
function updateVM(dt){ const g=VM.group; if(!g) return; VM.kick*=Math.exp(-dt*13);
  VM.sx=lerp(VM.sx,clamp(-frameDX*.00028,-.035,.035),1-Math.exp(-dt*10)); VM.sy=lerp(VM.sy,clamp(frameDY*.00028,-.03,.03),1-Math.exp(-dt*10));
  VM.bob+=dt; const bob=Math.sin(VM.bob*1.7)*.003+Math.sin(VM.bob*.9)*.0015;
  let rl=0; if(W.reloading) rl=Math.sin(Math.PI*clamp((now-W.reloadStart)/W.gun.reload,0,1));
  const a=W.adsT;
  g.position.set(lerp(VM.base.x,0,a)+VM.sx, lerp(VM.base.y,-.11,a)+VM.sy+bob-rl*.12-VM.kick*.012, lerp(VM.base.z,-.3,a)+VM.kick*.07);
  g.rotation.set(VM.kick*.22-rl*.55, .035*(1-a)+VM.sx*1.4, -VM.sx*1.8+rl*.38);
  const pump=g.userData.pump; if(pump){ VM.pumpT=Math.min(1,VM.pumpT+dt/.45); const pc=VM.pumpT<.15?0:Math.sin(Math.PI*clamp((VM.pumpT-.15)/.7,0,1)); pump.position.z=g.userData.pumpZ+pc*.075; }
  g.visible=!(W.gun.zoom&&a>.85); }
function loop(){ requestAnimationFrame(loop); const t=clock(); const dt=Math.min(.05,t-last); last=t; now=t; frameStamp=t;
  const r=run;
  if(r&&!r.paused&&r.state!=='done'){
    if(r.state==='countdown') countdownTick(dt);
    if(r.state==='live'){ r.elapsed+=dt;
      if(input.trigger&&W.gun.auto){ let n=0; while(n<3&&r.state==='live'&&!W.reloading&&clock()>=W.nextShot&&(W.ammo>0||r.infAmmo)){ fire(clock()); n++; }
        if(W.ammo<=0&&!r.infAmmo&&!W.reloading) startReload(); }
      if(r.timed&&r.elapsed>=r.dur) r.finish=true; }
    if(r.drill.tick) r.drill.tick(r,dt);
    if(W.reloading&&now>=W.reloadEnd){ W.reloading=false; W.ammo=W.gun.mag; if(r.drill.onReload) r.drill.onReload(r); }
    if(now-W.lastShot>60/W.gun.rpm+.06){ W.bloom=Math.max(0,W.bloom-dt*Math.max(.5,W.gun.bloomMax)*2.5); const k=Math.exp(-W.gun.recover*dt); REC.p*=k; REC.y*=k; }
    W.adsT=approach(W.adsT,(W.ads&&W.gun.zoom&&!W.reloading)?1:0,dt/.16);
    if(r.finish) endRun();
  } else if(!r){ const wide=innerWidth>760; yaw=(wide?.3:0)+Math.sin(t*.12)*.05; pitch=.03+Math.sin(t*.17)*.015; W.adsT=0; }
  applyView();
  const fov=baseVFov(); camera.fov=2*Math.atan(Math.tan(fov/2)/zoomFactor())/D2R; camera.updateProjectionMatrix();
  updateTargets(dt); updateFx(dt); updateVM(dt); updateHud(); frameDX=0; frameDY=0;
  renderer.clear(); renderer.render(scene,camera); if(VM.group&&VM.group.visible){ renderer.clearDepth(); renderer.render(vmScene,vmCam); }
  fpsN++; if(t-fpsT>.5){ if(save.settings.showFps) $('#fps').textContent=Math.round(fpsN/(t-fpsT))+' fps'; fpsN=0; fpsT=t; } }

/* ============================ boot ============================ */
resize(); applyAllSettings(); drawCard(); enterMenu(); loop(); initCloud();
})();
</script>
